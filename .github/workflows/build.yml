name: build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this run's packages to prefix.dev/universe"
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    # win-64 compiles the whole NCBI toolkit under MSYS2 on 4 cores;
    # everything else finishes well inside this.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-64, os: ubuntu-latest }
          - { platform: linux-aarch64, os: ubuntu-24.04-arm }
          - { platform: osx-64, os: macos-15-intel }
          - { platform: osx-arm64, os: macos-15 }
          - { platform: win-64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          cache: false
          # The default environment contains blast itself (path dep);
          # installing it here would build the package twice.
          run-install: false

      - name: Build package
        run: pixi build --output-dir dist

      - name: Test package in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/*.conda; do
            echo "== testing $f"
            pixi exec --spec rattler-build -- \
              rattler-build test --package-file "$f" -c conda-forge
          done

      - uses: actions/upload-artifact@v4
        with:
          name: blast-${{ matrix.platform }}
          path: dist/*.conda
          if-no-files-found: error

  # Experimental: no native win-arm64 zig exists on conda-forge, so this
  # cross-builds with the win-64 toolchain running under Windows-on-ARM's
  # x64 emulation while zig targets aarch64-windows-gnu. Configure's test
  # programs and datatool are aarch64 binaries that run natively here.
  # The pixi-build backend cannot express split build/target platforms,
  # hence the direct rattler-build invocation. Not part of the release
  # set until it graduates.
  win-arm64-experimental:
    name: win-arm64 (experimental)
    runs-on: windows-11-arm
    continue-on-error: true
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          cache: false
          run-install: false

      - name: Cross-build win-arm64 with win-64 toolchain
        shell: bash
        # Capped below the job limit so a stall still fails the step and
        # the diagnostics step below runs. The shims themselves retry a
        # zig invocation that stalls (nondeterministic under emulation;
        # two runs hung at different one-second configure link tests).
        run: |
          set -euo pipefail
          timeout 320m pixi exec --spec rattler-build -- rattler-build build --v3 \
            -r recipe/recipe.yaml \
            --build-platform win-64 \
            --target-platform win-arm64 \
            -c conda-forge \
            --output-dir dist

      - name: Diagnostics (where did configure/make stop?)
        if: always()
        shell: bash
        run: |
          set +e
          echo "== config.log tail:"
          f=$(find dist/bld -name config.log -path '*c++*' 2>/dev/null | head -1)
          [ -n "$f" ] && tail -n 120 "$f" || echo "(no config.log found)"
          echo "== last configure/make output lines:"
          for l in $(find dist/bld -name '*.log' -newer recipe/recipe.yaml 2>/dev/null | head -20); do
            echo "--- $l"; tail -n 15 "$l"
          done

      - name: Test package in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/win-arm64/*.conda dist/*.conda; do
            [ -f "$f" ] || continue
            echo "== testing $f"
            pixi exec --spec rattler-build -- \
              rattler-build test --package-file "$f" -c conda-forge
          done

      - uses: actions/upload-artifact@v4
        # Two independent guards keep experimental output off the channel:
        # no artifact at all on publishing runs, and a name outside the
        # blast-* pattern the publish job downloads.
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.publish }}
        with:
          name: experimental-win-arm64
          path: |
            dist/*.conda
            dist/win-arm64/*.conda
          if-no-files-found: error

  publish:
    name: publish to prefix.dev
    # A v* tag, or a manual run of main with the publish box ticked.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          cache: false
          run-install: false

      - uses: actions/download-artifact@v4
        with:
          pattern: blast-*
          path: dist
          merge-multiple: true

      - name: Upload packages to the universe channel
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
        shell: bash
        # --skip-existing makes re-publishing idempotent; the flip side is
        # that a rebuilt package with an unbumped build number is skipped
        # silently — bump build.number in recipe.yaml for any change.
        run: |
          set -euo pipefail
          ls -la dist/
          pixi exec --spec rattler-build -- \
            rattler-build upload prefix --channel universe --skip-existing dist/*.conda

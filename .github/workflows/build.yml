name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    # win-64 compiles the whole NCBI toolkit under MSYS2 on 4 cores;
    # everything else finishes well inside this.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-64, os: ubuntu-latest }
          - { platform: linux-aarch64, os: ubuntu-24.04-arm }
          - { platform: osx-64, os: macos-15-intel }
          - { platform: osx-arm64, os: macos-15 }
          - { platform: win-64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          cache: false
          # The default environment contains blast itself (path dep);
          # installing it here would build the package twice.
          run-install: false

      - name: Build package
        run: pixi build --output-dir dist

      - name: Test package in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/*.conda; do
            echo "== testing $f"
            pixi exec --spec rattler-build -- \
              rattler-build test --package-file "$f" -c conda-forge
          done

      - uses: actions/upload-artifact@v4
        with:
          name: blast-${{ matrix.platform }}
          path: dist/*.conda
          if-no-files-found: error

  publish:
    name: publish to prefix.dev
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          cache: false
          run-install: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload packages to the universe channel
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist/
          for f in dist/*.conda; do
            pixi exec --spec rattler-build -- \
              rattler-build upload prefix --channel universe "$f"
          done

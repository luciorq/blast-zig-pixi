[workspace]
authors = ["luciorq <luciorqueiroz@gmail.com>"]
channels = ["conda-forge"]
name = "blast-zig-pixi"
# The x86_64 entries declare an assumed CPU microarch level (__archspec)
# so lockfile solves for foreign platforms can satisfy the package's
# _x86_64-microarch-level >=2 gate — the same v2 floor the binaries
# require at runtime.
platforms = [
  { platform = "linux-64", archspec = "x86_64_v2" },
  { platform = "osx-64", archspec = "x86_64_v2" },
  { platform = "win-64", archspec = "x86_64_v2" },
  "osx-arm64",
]
version = "0.1.0"
preview = ["pixi-build"]

# Installing the workspace environment builds the `blast` package from this
# repo and puts its binaries (blastn, makeblastdb, ...) on the env PATH.
[dependencies]
blast = { path = "." }

[tasks]
blastn-version = "blastn -version"

# v3 extras consumption: the `scripts` environment additionally pulls the
# package's optional `scripts` dependency group (perl + python), making
# the bundled helper scripts runnable:
#   pixi run -e scripts update-blastdb-check
[feature.scripts.dependencies]
blast = { path = ".", extras = ["scripts"] }

[feature.scripts.tasks]
update-blastdb-check = "perl -c $CONDA_PREFIX/bin/update_blastdb.pl"

[environments]
scripts = { features = ["scripts"], no-default-feature = true }

[package]
name = "blast"
version = "2.17.0"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }
